          cat > meow-client/src/main/java/com/meowclient/hud/Hud.java <<'MEOW_EOF'
          package com.meowclient.hud;

          import com.meowclient.gui.Theme;
          import com.meowclient.module.MeowModule;
          import net.minecraft.block.Blocks;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.RespawnAnchorBlock;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.component.DataComponentTypes;
          import net.minecraft.component.type.PotionContentsComponent;
          import net.minecraft.entity.EquipmentSlot;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.attribute.EntityAttributes;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.entity.effect.StatusEffects;
          import net.minecraft.entity.player.PlayerInventory;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.registry.Registries;
          import net.minecraft.registry.tag.ItemTags;
          import net.minecraft.util.hit.BlockHitResult;
          import net.minecraft.util.hit.HitResult;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.World;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.function.Predicate;

          /** Builds the informational HUD panels. Everything here is read-only: nothing attacks, aims or swaps items. */
          public final class Hud {
              public record Block(String title, List<String> lines, float bar, int barColor) {}

              private static final String G = "\u00a7a", Y = "\u00a7e", R = "\u00a7c", W = "\u00a7f", GR = "\u00a77";

              private static double lastHealth;
              private static long lastDamageTick = -1;
              private static float lastDamage;
              private static int groundDist = -1, switchFlash, tickN;
              private static String lastHeld = "";
              private static long armSince = -1;

              // ------------------------------------------------------------ per-tick state
              public static void tick(MinecraftClient mc) {
                  Theme.update(0.05f);
                  ClientPlayerEntity p = mc.player;
                  if (p == null || mc.world == null) { lastDamageTick = -1; lastHeld = ""; return; }
                  tickN++;
                  double hp = p.getHealth();
                  if (hp < lastHealth) { lastDamage = (float) (lastHealth - hp); lastDamageTick = mc.world.getTime(); }
                  lastHealth = hp;
                  String held = Registries.ITEM.getId(p.getMainHandStack().getItem()).getPath();
                  if (!held.equals(lastHeld)) { if (!lastHeld.isEmpty()) switchFlash = 30; lastHeld = held; }
                  if (switchFlash > 0) switchFlash--;
                  if (tickN % 3 == 0) {
                      BlockPos.Mutable pos = p.getBlockPos().mutableCopy();
                      int d = 0;
                      while (d < 128 && mc.world.isAir(pos) && pos.getY() > mc.world.getBottomY()) { pos.move(Direction.DOWN); d++; }
                      groundDist = d;
                  }
              }

              public static boolean warningActive(MinecraftClient mc) {
                  MeowModule m = com.meowclient.module.ModuleManager.byName("Stun Slam Education");
                  if (m == null || !m.enabled || !m.bool("Flash Border") || mc.player == null) return false;
                  return mc.player.getMainHandStack().isOf(Items.MACE) && mc.player.fallDistance >= m.num("Warning Threshold");
              }

              // ------------------------------------------------------------ helpers
              private static String fmt(double d) { return String.format("%.1f", d); }
              private static String time(int ticks) { int s = Math.max(0, ticks / 20); return (s / 60) + ":" + String.format("%02d", s % 60); }
              private static boolean isSpear(ItemStack s) { return Registries.ITEM.getId(s.getItem()).getPath().endsWith("_spear"); }
              private static int count(PlayerInventory inv, Predicate<ItemStack> f) {
                  int n = 0;
                  for (int i = 0; i < inv.size(); i++) { ItemStack s = inv.getStack(i); if (!s.isEmpty() && f.test(s)) n += s.getCount(); }
                  return n;
              }
              private static boolean isPotion(ItemStack s) { return s.isOf(Items.POTION) || s.isOf(Items.SPLASH_POTION) || s.isOf(Items.LINGERING_POTION); }
              private static boolean healing(ItemStack s) {
                  if (!isPotion(s)) return false;
                  PotionContentsComponent pc = s.get(DataComponentTypes.POTION_CONTENTS);
                  if (pc == null) return false;
                  for (StatusEffectInstance e : pc.getEffects()) if (e.getEffectType().equals(StatusEffects.INSTANT_HEALTH)) return true;
                  return false;
              }
              private static String lowWarn(int n, double warn) { return (n < warn ? R : G) + n; }
              private static String check(String label, boolean ok) { return (ok ? G + "[+] " : R + "[-] ") + W + label; }
              private static double smashBonus(double f) {
                  if (f <= 1.5) return 0;
                  return 4 * Math.min(f, 3) + 2 * Math.min(Math.max(f - 3, 0), 5) + Math.max(f - 8, 0);
              }
              private static void add(List<String> L, String name, int n, boolean hideZero) { if (!(hideZero && n == 0)) L.add(GR + name + ": " + W + n); }
              private static String name(ItemStack s) { return s.isEmpty() ? GR + "-" : W + s.getName().getString() + (s.getCount() > 1 ? GR + " x" + s.getCount() : ""); }

              private static List<String> armor(ClientPlayerEntity p, boolean pct) {
                  List<String> L = new ArrayList<>();
                  String[] names = {"Helmet", "Chest", "Legs", "Boots"};
                  EquipmentSlot[] slots = {EquipmentSlot.HEAD, EquipmentSlot.CHEST, EquipmentSlot.LEGS, EquipmentSlot.FEET};
                  for (int i = 0; i < 4; i++) {
                      ItemStack s = p.getEquippedStack(slots[i]);
                      if (s.isEmpty() || !s.isDamageable()) { L.add(GR + names[i] + ": -"); continue; }
                      int left = s.getMaxDamage() - s.getDamage();
                      double ratio = left / (double) s.getMaxDamage();
                      String col = ratio > 0.5 ? G : ratio > 0.25 ? Y : R;
                      L.add(GR + names[i] + ": " + col + (pct ? (int) (ratio * 100) + "%" : String.valueOf(left)));
                  }
                  return L;
              }

              private static String weaponChange(MinecraftClient mc) {
                  return switchFlash > 0 ? Y + ">> Weapon changed: " + W + mc.player.getMainHandStack().getName().getString() : null;
              }

              // ------------------------------------------------------------ panel builder
              public static Block build(MeowModule m, MinecraftClient mc) {
                  ClientPlayerEntity p = mc.player;
                  PlayerInventory inv = p.getInventory();
                  ItemStack main = p.getMainHandStack();
                  double fd = p.fallDistance, vy = p.getVelocity().y * 20.0;
                  boolean mace = main.isOf(Items.MACE);
                  List<String> L = new ArrayList<>();
                  float bar = -1; int barCol = 0xFF22C55E;

                  switch (m.name) {
                      case "Auto Mace": {
                          boolean legit = m.bool("Legit Mode");
                          double need = m.num("Min Fall Distance") + (legit ? 0.5 : 0);
                          boolean wf = fd > need, wv = vy < 0, wt = mc.targetedEntity instanceof LivingEntity, wm = mace;
                          boolean wc = !legit || p.getAttackCooldownProgress(0f) >= 0.9f;
                          boolean all = wf && wv && wt && wm && wc;
                          long now = System.currentTimeMillis();
                          if (!all) armSince = -1; else if (armSince < 0) armSince = now;
                          String st = !all ? GR + "IDLE" : (now - armSince < m.num("Cooldown") ? Y + "ARMING" : G + "READY (display only)");
                          L.add(check("Fall > " + fmt(need) + " (" + fmt(fd) + ")", wf));
                          L.add(check("Falling (Y vel " + fmt(vy) + ")", wv));
                          L.add(check("Looking at LivingEntity", wt));
                          L.add(check("Mace selected", wm));
                          if (legit) L.add(check("Swing charge >= 90%", wc));
                          L.add("Status: " + st);
                          return new Block("Auto Mace Checklist", L, -1, 0);
                      }
                      case "Potion HUD": {
                          boolean dur = m.bool("Show Duration"), lvl = m.bool("Show Level");
                          for (StatusEffectInstance e : p.getStatusEffects()) {
                              String s = W + e.getEffectType().value().getName().getString();
                              if (lvl) s += GR + " " + (e.getAmplifier() + 1);
                              if (dur) s += GR + "  " + (e.isInfinite() ? "inf" : time(e.getDuration()));
                              L.add(s);
                          }
                          if (L.isEmpty()) L.add(GR + "No active effects");
                          return new Block("Potion HUD", L, -1, 0);
                      }
                      case "Potion Counter": {
                          int total = count(inv, Hud::isPotion), heal = count(inv, Hud::healing);
                          L.add(GR + "Potions: " + W + total);
                          if (m.bool("Show Healing Count")) L.add(GR + "Healing: " + lowWarn(heal, m.num("Warn Below")));
                          return new Block("Potion Counter", L, -1, 0);
                      }
                      case "Effect Timer": {
                          StatusEffectInstance best = null;
                          for (StatusEffectInstance e : p.getStatusEffects()) if (!e.isInfinite() && (best == null || e.getDuration() < best.getDuration())) best = e;
                          if (best == null) L.add(GR + "No timed effects");
                          else {
                              boolean low = best.getDuration() / 20.0 < m.num("Warn Below");
                              L.add(W + best.getEffectType().value().getName().getString());
                              L.add((low ? R : G) + time(best.getDuration()) + " left");
                          }
                          return new Block("Effect Timer", L, -1, 0);
                      }
                      case "Armor Durability":
                          return new Block("Armor Durability", armor(p, m.bool("Show Percent")), -1, 0);
                      case "Hotbar Organizer": {
                          for (int i = 0; i < 9; i++) {
                              ItemStack s = inv.getStack(i);
                              if (s.isEmpty() && !m.bool("Show Empty Slots")) continue;
                              L.add(GR + (i + 1) + ": " + name(s));
                          }
                          return new Block("Hotbar Layout", L, -1, 0);
                      }
                      case "Healing Practice": {
                          L.add(GR + "Health: " + W + fmt(p.getHealth()) + GR + "  Absorb: " + Y + fmt(p.getAbsorptionAmount()));
                          if (m.bool("Show Last Damage")) {
                              if (lastDamageTick < 0) L.add(GR + "No damage taken yet");
                              else L.add(GR + "Last hit: " + R + fmt(lastDamage) + GR + " (" + fmt((mc.world.getTime() - lastDamageTick) / 20.0) + "s ago)");
                          }
                          L.add(GR + "Healing potions: " + W + count(inv, Hud::healing));
                          return new Block("Healing Practice", L, -1, 0);
                      }
                      case "Crystal Counter":
                          L.add(GR + "End crystals: " + lowWarn(count(inv, s -> s.isOf(Items.END_CRYSTAL)), m.num("Warn Below")));
                          return new Block("Crystal Counter", L, -1, 0);
                      case "Obsidian Counter":
                          L.add(GR + "Obsidian: " + lowWarn(count(inv, s -> s.isOf(Items.OBSIDIAN)), m.num("Warn Below")));
                          return new Block("Obsidian Counter", L, -1, 0);
                      case "Totem Counter":
                          L.add(GR + "Totems: " + lowWarn(count(inv, s -> s.isOf(Items.TOTEM_OF_UNDYING)), m.num("Warn Below")));
                          return new Block("Totem Counter", L, -1, 0);
                      case "Anchor Information": {
                          L.add(GR + "Anchors: " + W + count(inv, s -> s.isOf(Items.RESPAWN_ANCHOR)) + GR + "  Glowstone: " + W + count(inv, s -> s.isOf(Items.GLOWSTONE)));
                          if (mc.crosshairTarget instanceof BlockHitResult bhr && bhr.getType() == HitResult.Type.BLOCK) {
                              BlockState bs = mc.world.getBlockState(bhr.getBlockPos());
                              if (bs.isOf(Blocks.RESPAWN_ANCHOR)) L.add(GR + "Looking at anchor, charges: " + Y + bs.get(RespawnAnchorBlock.CHARGES) + GR + "/4");
                          }
                          if (m.bool("Show Dimension Note"))
                              L.add(mc.world.getRegistryKey() == World.NETHER ? G + "Nether: anchors are safe" : R + "Here a charged anchor explodes");
                          return new Block("Anchor Info", L, -1, 0);
                      }
                      case "Crystal Practice": {
                          if (mc.crosshairTarget instanceof BlockHitResult bhr && bhr.getType() == HitResult.Type.BLOCK) {
                              BlockPos bp = bhr.getBlockPos();
                              BlockState bs = mc.world.getBlockState(bp);
                              boolean base = bs.isOf(Blocks.OBSIDIAN) || bs.isOf(Blocks.BEDROCK);
                              boolean space = mc.world.isAir(bp.up()) && mc.world.isAir(bp.up(2));
                              L.add(check("Obsidian/bedrock base", base));
                              L.add(check("2 air blocks above", space));
                              L.add(base && space ? G + "Valid crystal spot" : R + "Not valid");
                              if (m.bool("Show Distance")) L.add(GR + "Distance: " + W + fmt(p.getEyePos().distanceTo(Vec3d.ofCenter(bp))));
                          } else L.add(GR + "Look at a block");
                          return new Block("Crystal Practice", L, -1, 0);
                      }
                      case "Inventory Tracker": {
                          boolean hz = m.bool("Hide Zero Items");
                          add(L, "Totems", count(inv, s -> s.isOf(Items.TOTEM_OF_UNDYING)), hz);
                          add(L, "Crystals", count(inv, s -> s.isOf(Items.END_CRYSTAL)), hz);
                          add(L, "Obsidian", count(inv, s -> s.isOf(Items.OBSIDIAN)), hz);
                          add(L, "Anchors", count(inv, s -> s.isOf(Items.RESPAWN_ANCHOR)), hz);
                          add(L, "Glowstone", count(inv, s -> s.isOf(Items.GLOWSTONE)), hz);
                          add(L, "Pearls", count(inv, s -> s.isOf(Items.ENDER_PEARL)), hz);
                          add(L, "Gapples", count(inv, s -> s.isOf(Items.GOLDEN_APPLE) || s.isOf(Items.ENCHANTED_GOLDEN_APPLE)), hz);
