          package com.meowclient.module;

          import java.util.ArrayList;
          import java.util.List;

          public class MeowModule {
              /** HUD = live information display, PLACEHOLDER = saved settings only (never automates), SYSTEM = client setting. */
              public enum Kind { HUD, PLACEHOLDER, SYSTEM }

              public final String category, section, name, purpose, how, recommended;
              public final Kind kind;
              public boolean enabled;
              public final List<Setting> settings = new ArrayList<>();

              public MeowModule(String category, String section, String name, Kind kind, String purpose, String how, String recommended) {
                  this.category = category; this.section = section; this.name = name; this.kind = kind;
                  this.purpose = purpose; this.how = how; this.recommended = recommended;
              }

              public String id() { return section + "/" + name; }

              public boolean bool(String n) {
                  for (Setting s : settings) if (s instanceof Setting.Bool b && b.name.equals(n)) return b.value;
                  return false;
              }

              public double num(String n) {
                  for (Setting s : settings) if (s instanceof Setting.Num x && x.name.equals(n)) return x.value;
                  return 0;
              }
          }
