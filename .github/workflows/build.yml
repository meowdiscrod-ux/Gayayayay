                      case "Utility Counter": {
                          boolean hz = m.bool("Hide Zero Items");
                          add(L, "Water buckets", count(inv, s -> s.isOf(Items.WATER_BUCKET)), hz);
                          add(L, "Lava buckets", count(inv, s -> s.isOf(Items.LAVA_BUCKET)), hz);
                          add(L, "Cobwebs", count(inv, s -> s.isOf(Items.COBWEB)), hz);
                          add(L, "Arrows", count(inv, s -> s.isOf(Items.ARROW)), hz);
                          add(L, "Pearls", count(inv, s -> s.isOf(Items.ENDER_PEARL)), hz);
                          if (L.isEmpty()) L.add(GR + "Nothing tracked");
                          return new Block("Utility", L, -1, 0);
