                          if (sp) { L.add(name(main)); if (main.isDamageable()) L.add(GR + "Durability: " + W + (main.getMaxDamage() - main.getDamage())); }
                          else L.add(GR + "Hold a spear for details");
                          return new Block("Spear Mechanics", L, -1, 0);
