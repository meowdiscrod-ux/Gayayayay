                          bar = p.getAttackCooldownProgress(0f); barCol = 0xFF38BDF8;
                          return new Block("Weapon", L, bar, barCol);
                      }
                      case "Combat HUD": {
                          L.add(GR + "Health: " + W + fmt(p.getHealth()) + GR + "  Weapon: " + W + main.getName().getString());
                          if (m.bool("Show Target") && mc.targetedEntity instanceof LivingEntity le)
                              L.add(GR + "Target: " + W + le.getName().getString() + GR + " (" + fmt(le.getHealth()) + " HP)");
