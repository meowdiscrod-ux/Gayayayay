          package com.meowclient.gui;

          public final class Theme {
              public static final String[] NAMES = {"Purple", "Cyan", "Red", "Green"};
              public static final int[] COLORS = {0xA855F7, 0x22D3EE, 0xEF4444, 0x22C55E};
              public static int index = 0;
              private static float r, g, b;
              private static boolean init;

              public static void set(int i) {
                  if (i < 0 || i >= COLORS.length) return;
                  index = i;
              }

              /** Smoothly animates the accent color toward the selected theme. */
              public static void update(float dt) {
                  int t = COLORS[index];
                  float tr = (t >> 16) & 255, tg = (t >> 8) & 255, tb = t & 255;
                  if (!init) { r = tr; g = tg; b = tb; init = true; return; }
                  float k = 1f - (float) Math.exp(-dt * 6f);
                  r += (tr - r) * k; g += (tg - g) * k; b += (tb - b) * k;
              }

              /** Current animated accent as 0xRRGGBB. */
              public static int accent() {
                  if (!init) update(0);
                  return ((int) r << 16) | ((int) g << 8) | (int) b;
              }
          }
