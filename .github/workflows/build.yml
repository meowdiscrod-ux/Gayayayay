                      case "Bow Information": {
                          L.add(GR + "Arrows: " + W + count(inv, s -> s.isOf(Items.ARROW)));
                          if (main.isOf(Items.BOW) && p.isUsingItem()) {
                              float f = Math.min(1f, p.getItemUseTime() / 20f);
