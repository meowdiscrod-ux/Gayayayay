name: Build Meow Client

# Self-contained: this single file contains the whole client source.
# Put it at .github/workflows/build.yml in an empty GitHub repo, then run it from the Actions tab.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Write project files
        run: |
          mkdir -p meow-client
          cat > meow-client/README.md <<'MEOW_EOF'
          # Meow Client (Fabric, Minecraft 1.21.11, Java 21)

          Mod ID `meowclient` - entry `com.meowclient.MeowClient` - GUI title MEOW CLIENT.

          ## Build
          1. Install JDK 21 and Gradle 9.2.1 (or newer).
          2. In this folder run: `gradle wrapper --gradle-version 9.2.1` (once), then `./gradlew build`
             (Windows: `gradlew.bat build`).
          3. The jar is `build/libs/meow-client-1.0.0.jar` (ignore the `-sources` jar).

          ## Install (PC or MJ Launcher / mobile launchers)
          Fabric Loader 0.18.4+, Fabric API 0.141.1+1.21.11, Java 21 runtime, then drop the jar into `mods/`.

          ## Open the GUI
          Right Shift in-game or on the title screen (rebindable in Controls), or tap the **Meow** button
          at the top-left of the title screen / pause menu (for devices with no keyboard).

          ## Behavior
          - Combat modules Trigger Bot, Aim Assist, Auto Anchor, Auto Pearl Catch, Auto Potion and
            Auto Stun Slam are TESTING PLACEHOLDERS: they save settings and explain the concept; they never
            attack, aim, or swap items.
          - Auto Mace shows an educational live checklist only.
          - All other modules are read-only information HUDs.
          - Settings are saved to `config/meowclient.json`.

          ## Status
          NOT compiled or tested yet (written without network/Gradle access). Minecraft 1.21.9+ changed several
          GUI/input APIs; if the compiler reports a mismatch, the likely spots are `Click`/`KeyInput` in
          `MeowScreen`, `KeyBinding.Category` and `HudRenderCallback` in `MeowClient`, and
          `Window.getHandle()`.
          MEOW_EOF
          mkdir -p meow-client
          cat > meow-client/build.gradle <<'MEOW_EOF'
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          MEOW_EOF
          mkdir -p meow-client
          cat > meow-client/gradle.properties <<'MEOW_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Mod
          mod_version=1.0.0
          maven_group=com.meowclient
          archives_base_name=meow-client

          # Fabric (Minecraft 1.21.11, Yarn mappings)
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          loom_version=1.14-SNAPSHOT
          fabric_api_version=0.141.1+1.21.11
          MEOW_EOF
          mkdir -p meow-client
          cat > meow-client/settings.gradle <<'MEOW_EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'meow-client'
          MEOW_EOF
          mkdir -p meow-client/src/main/java/com/meowclient
          cat > meow-client/src/main/java/com/meowclient/MeowClient.java <<'MEOW_EOF'
          package com.meowclient;

          import com.meowclient.gui.MeowScreen;
          import com.meowclient.hud.Hud;
          import com.meowclient.hud.HudRenderer;
          import com.meowclient.module.ModuleManager;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.client.screen.v1.Screens;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.GameMenuScreen;
          import net.minecraft.client.gui.screen.TitleScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class MeowClient implements ClientModInitializer {
              public static final String MOD_ID = "meowclient";
              public static KeyBinding openKey;
              private boolean shiftWasDown;

              @Override
              public void onInitializeClient() {
                  ModuleManager.init();

                  openKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.meowclient.open", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT,
                      KeyBinding.Category.create(Identifier.of(MOD_ID, "main"))));

                  ClientTickEvents.END_CLIENT_TICK.register(this::tick);
                  HudRenderCallback.EVENT.register(HudRenderer::render);

                  // On-screen "Meow" button for launchers/devices without a physical Right Shift key.
                  ScreenEvents.AFTER_INIT.register((client, screen, w, h) -> {
                      if (screen instanceof TitleScreen || screen instanceof GameMenuScreen) {
                          Screens.getButtons(screen).add(ButtonWidget.builder(Text.literal("Meow"),
                              b -> client.setScreen(new MeowScreen(screen))).dimensions(6, 6, 44, 20).build());
                      }
                  });
              }

              private void tick(MinecraftClient client) {
                  Hud.tick(client); // safe: returns early when player/world are null

                  if (client.currentScreen == null && client.player != null && client.world != null) {
                      while (openKey.wasPressed()) client.setScreen(new MeowScreen(null));
                  } else if (client.currentScreen instanceof TitleScreen) {
                      // Main menu / client.world == null: poll Right Shift directly (edge-triggered).
                      boolean down = GLFW.glfwGetKey(client.getWindow().getHandle(), GLFW.GLFW_KEY_RIGHT_SHIFT) == GLFW.GLFW_PRESS;
                      if (down && !shiftWasDown) client.setScreen(new MeowScreen(client.currentScreen));
                      shiftWasDown = down;
                  } else {
                      shiftWasDown = false;
                  }
              }
          }
          MEOW_EOF
          mkdir -p meow-client/src/main/java/com/meowclient/gui
          cat > meow-client/src/main/java/com/meowclient/gui/CursorOrbit.java <<'MEOW_EOF'
          package com.meowclient.gui;

          import net.minecraft.client.gui.DrawContext;

          /** Two counter-rotating orbit rings (one circular, one tilted ellipse) with glowing, fading-trail particles. */
          public final class CursorOrbit {
              private static final int PER = 5, TRAIL = 10, N = PER * 2;
              private static final float TAU = (float) (Math.PI * 2);
              private final float[] hist = new float[N * TRAIL * 2];
              private float cx, cy, acc;
              private boolean init;

              public void render(DrawContext c, int mx, int my, float dt, float t, int accent) {
                  if (!init) { cx = mx; cy = my; init = true; java.util.Arrays.fill(hist, 0f); for (int i = 0; i < N * TRAIL; i++) { hist[i * 2] = mx; hist[i * 2 + 1] = my; } }
                  float k = 1f - (float) Math.exp(-dt * 16f);
                  cx += (mx - cx) * k; cy += (my - cy) * k;
                  acc += dt;
                  boolean sample = acc >= 0.014f;
                  if (sample) acc = 0;

                  // faint guide rings
                  for (int i = 0; i < 28; i++) {
                      float a = i * TAU / 28f;
                      c.fill((int) (cx + Math.cos(a) * 16), (int) (cy + Math.sin(a) * 16), (int) (cx + Math.cos(a) * 16) + 1, (int) (cy + Math.sin(a) * 16) + 1, Glass.a(accent, 38));
                  }
                  float tilt = -t * 0.9f, ct = (float) Math.cos(tilt), st = (float) Math.sin(tilt);
                  for (int i = 0; i < 28; i++) {
                      float a = i * TAU / 28f;
                      float ex = (float) Math.cos(a) * 25, ey = (float) Math.sin(a) * 10;
                      int gx = (int) (cx + ex * ct - ey * st), gy = (int) (cy + ex * st + ey * ct);
                      c.fill(gx, gy, gx + 1, gy + 1, Glass.a(0xFFFFFF, 30));
                  }

                  int light = Glass.mix(Glass.a(accent, 255), 0xFFFFFFFF, 0.55f);
                  for (int ring = 0; ring < 2; ring++) {
                      float dir = ring == 0 ? 1f : -1f;
                      for (int p = 0; p < PER; p++) {
                          int n = ring * PER + p;
                          float ang = dir * t * (ring == 0 ? 2.3f : 1.7f) + p * TAU / PER;
                          float x, y;
                          if (ring == 0) {
                              x = cx + (float) Math.cos(ang) * 16f;
                              y = cy + (float) Math.sin(ang) * 16f;
                          } else {
                              float ex = (float) Math.cos(ang) * 25f, ey = (float) Math.sin(ang) * 10f;
                              x = cx + ex * ct - ey * st;
                              y = cy + ex * st + ey * ct;
                          }
                          int base = n * TRAIL * 2;
                          if (sample) {
                              System.arraycopy(hist, base, hist, base + 2, (TRAIL - 1) * 2);
                              hist[base] = x; hist[base + 1] = y;
                          }
                          int col = ring == 0 ? accent : light;
                          for (int j = TRAIL - 1; j >= 1; j--) {
                              int tx = (int) hist[base + j * 2], ty = (int) hist[base + j * 2 + 1];
                              c.fill(tx, ty, tx + 1, ty + 1, Glass.a(col, (int) (140f * (1f - j / (float) TRAIL))));
                          }
                          int hx = (int) x, hy = (int) y;
                          c.fill(hx - 2, hy - 2, hx + 3, hy + 3, Glass.a(col, 50));
                          c.fill(hx - 1, hy - 1, hx + 2, hy + 2, Glass.a(col, 230));
                          c.fill(hx, hy, hx + 1, hy + 1, 0xFFFFFFFF);
                      }
                  }
              }
          }
          MEOW_EOF
          mkdir -p meow-client/src/main/java/com/meowclient/gui
          cat > meow-client/src/main/java/com/meowclient/gui/Glass.java <<'MEOW_EOF'
          package com.meowclient.gui;

          import net.minecraft.client.gui.DrawContext;

          /** Liquid-glass drawing helpers built from plain fills so they work on any launcher/GPU. */
          public final class Glass {
              public static int argb(int a, int r, int g, int b) { return (clamp(a) << 24) | (r << 16) | (g << 8) | b; }
              public static int a(int color, int alpha) { return (clamp(alpha) << 24) | (color & 0xFFFFFF); }
              private static int clamp(int v) { return Math.max(0, Math.min(255, v)); }

              public static int scaleA(int argb, float f) {
                  return (clamp((int) (((argb >>> 24) & 255) * f)) << 24) | (argb & 0xFFFFFF);
              }

              public static int mix(int c1, int c2, float t) {
                  t = Math.max(0, Math.min(1, t));
                  int a = (int) (((c1 >>> 24) & 255) * (1 - t) + ((c2 >>> 24) & 255) * t);
                  int r = (int) (((c1 >> 16) & 255) * (1 - t) + ((c2 >> 16) & 255) * t);
                  int g = (int) (((c1 >> 8) & 255) * (1 - t) + ((c2 >> 8) & 255) * t);
                  int b = (int) ((c1 & 255) * (1 - t) + (c2 & 255) * t);
                  return argb(a, r, g, b);
              }

              private static int inset(int r, int i) {
                  double dy = r - i - 0.5;
                  return r - (int) Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)));
              }

              public static void rrect(DrawContext c, int x, int y, int w, int h, int r, int color) {
                  if (w <= 0 || h <= 0) return;
                  r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
                  for (int i = 0; i < r; i++) {
                      int s = inset(r, i);
                      c.fill(x + s, y + i, x + w - s, y + i + 1, color);
                      c.fill(x + s, y + h - 1 - i, x + w - s, y + h - i, color);
                  }
                  c.fill(x, y + r, x + w, y + h - r, color);
              }

              public static void outline(DrawContext c, int x, int y, int w, int h, int r, int color) {
                  if (w <= 2 || h <= 2) return;
                  r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
                  if (r == 0) {
                      c.fill(x, y, x + w, y + 1, color); c.fill(x, y + h - 1, x + w, y + h, color);
                      c.fill(x, y + 1, x + 1, y + h - 1, color); c.fill(x + w - 1, y + 1, x + w, y + h - 1, color);
                      return;
                  }
                  int s0 = inset(r, 0);
                  c.fill(x + s0, y, x + w - s0, y + 1, color);
                  c.fill(x + s0, y + h - 1, x + w - s0, y + h, color);
                  int prev = s0;
                  for (int i = 1; i < r; i++) {
                      int s = inset(r, i);
                      int seg = Math.max(1, prev - s);
                      c.fill(x + s, y + i, x + s + seg, y + i + 1, color);
                      c.fill(x + w - s - seg, y + i, x + w - s, y + i + 1, color);
                      c.fill(x + s, y + h - 1 - i, x + s + seg, y + h - i, color);
                      c.fill(x + w - s - seg, y + h - 1 - i, x + w - s, y + h - i, color);
                      prev = s;
                  }
                  c.fill(x, y + r, x + 1, y + h - r, color);
                  c.fill(x + w - 1, y + r, x + w, y + h - r, color);
              }

              /** Main frosted-glass panel with glow border, sheen and top glint. */
              public static void panel(DrawContext c, int x, int y, int w, int h, int r, int accent, float alpha) {
                  outline(c, x - 2, y - 2, w + 4, h + 4, r + 2, scaleA(a(accent, 22), alpha));
                  outline(c, x - 1, y - 1, w + 2, h + 2, r + 1, scaleA(a(accent, 55), alpha));
                  rrect(c, x, y, w, h, r, scaleA(argb(120, 14, 16, 36), alpha));
                  c.fillGradient(x + r, y + 1, x + w - r, y + Math.max(2, h / 3), scaleA(argb(46, 255, 255, 255), alpha), scaleA(argb(0, 255, 255, 255), alpha));
                  c.fillGradient(x + r, y + h - Math.max(2, h / 5), x + w - r, y + h - 1, scaleA(a(accent, 0), alpha), scaleA(a(accent, 34), alpha));
                  outline(c, x, y, w, h, r, scaleA(a(accent, 175), alpha));
                  c.fill(x + r, y + 1, x + w - r, y + 2, scaleA(argb(80, 255, 255, 255), alpha));
              }

              /** Smaller glass card used for rows and setting blocks. */
              public static void card(DrawContext c, int x, int y, int w, int h, int r, int accent, float hover) {
                  rrect(c, x, y, w, h, r, argb(26 + (int) (hover * 26), 255, 255, 255));
                  c.fillGradient(x + r, y + 1, x + w - r, y + Math.max(2, h / 2), argb(22, 255, 255, 255), argb(0, 255, 255, 255));
                  outline(c, x, y, w, h, r, a(Glass.mix(0x40FFFFFF, a(accent, 200), hover), 60 + (int) (hover * 110)));
              }
          }
          MEOW_EOF
          mkdir -p meow-client/src/main/java/com/meowclient/gui
          cat > meow-client/src/main/java/com/meowclient/gui/MeowScreen.java <<'MEOW_EOF'
          package com.meowclient.gui;

          import com.meowclient.module.*;
          import com.meowclient.module.MeowModule.Kind;
          import net.minecraft.client.gui.Click;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.input.KeyInput;
          import net.minecraft.text.OrderedText;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;
          import org.lwjgl.glfw.GLFW;

          import java.util.*;
          import java.util.function.DoubleConsumer;

          public class MeowScreen extends Screen {
              private static final int TXT = 0xFFFFFFFF, DIM = 0xFFB9C0D8;

              private static final class Hit {
                  final int x, y, w, h, cx, cy, cw, ch;
                  Runnable click; DoubleConsumer drag; String tipT, tipB;
                  Hit(int x, int y, int w, int h, int cx, int cy, int cw, int ch) { this.x = x; this.y = y; this.w = w; this.h = h; this.cx = cx; this.cy = cy; this.cw = cw; this.ch = ch; }
                  boolean contains(double mx, double my) {
                      return mx >= x && mx < x + w && my >= y && my < y + h && mx >= cx && mx < cx + cw && my >= cy && my < cy + ch;
                  }
              }

              private final Screen parent;
              private int catIdx = 0;
              private final Set<String> open = new HashSet<>(Set.of("General Combat"));
              private MeowModule sel;
              private float scroll, scrollTarget, maxScroll, dt, time, tipA;
              private String tipT = "", tipB = "";
              private final Map<String, Float> anims = new HashMap<>();
              private final List<Hit> hits = new ArrayList<>();
              private Hit dragHit;
              private long last = System.nanoTime();
              private final SnowEffect snow = new SnowEffect();
              private final CursorOrbit orbit = new CursorOrbit();
              private int px, py, pw, ph, sw, mouseX, mouseY, clipX, clipY, clipW, clipH, snowCount;

              public MeowScreen(Screen parent) {
                  super(Text.literal("MEOW CLIENT"));
                  this.parent = parent;
              }

              @Override protected void init() {
                  snowCount = (int) fx().num("Snow Density");
                  snow.init(width, height, snowCount);
              }

              @Override public boolean shouldPause() { return false; }
              @Override public void close() { client.setScreen(parent); }
              @Override public void removed() { ModuleManager.save(); }

              private MeowModule fx() { return ModuleManager.byName("GUI Effects"); }

              // ------------------------------------------------------------------ helpers
              private float anim(String k, boolean on, float speed) {
                  float t = on ? 1f : 0f, v = anims.getOrDefault(k, t);
                  v += (t - v) * Math.min(1f, dt * speed);
                  anims.put(k, v);
                  return v;
              }

              private Hit add(int x, int y, int w, int h) {
                  Hit hit = new Hit(x, y, w, h, clipX, clipY, clipW, clipH);
                  hits.add(hit);
                  return hit;
              }

              private void clipAll() { clipX = 0; clipY = 0; clipW = width; clipH = height; }

              private void txt(DrawContext c, String s, int x, int y, int col) { c.drawText(textRenderer, s, x, y, col, false); }

              private int wrapCount(String s, int w) { return textRenderer.wrapLines(Text.literal(s), Math.max(20, w)).size(); }

              private int wrapped(DrawContext c, String s, int x, int y, int w, int col) {
                  for (OrderedText l : textRenderer.wrapLines(Text.literal(s), Math.max(20, w))) { c.drawText(textRenderer, l, x, y, col, false); y += 10; }
                  return y;
              }

              private void toggle(DrawContext c, int x, int y, boolean on, String key, int acc) {
                  float t = anim(key, on, 12f);
                  Glass.rrect(c, x, y, 22, 12, 6, Glass.mix(Glass.argb(130, 90, 95, 125), Glass.a(acc, 235), t));
                  Glass.rrect(c, x + 1 + Math.round(10 * t), y + 1, 10, 10, 5, 0xFFFFFFFF);
              }

              private void infoIcon(DrawContext c, int x, int y, int acc, String title, String body, boolean hover) {
                  Glass.rrect(c, x, y, 12, 12, 6, Glass.a(acc, hover ? 230 : 140));
                  c.drawText(textRenderer, "i", x + 5, y + 2, TXT, false);
                  Hit h = add(x - 2, y - 2, 16, 16);
                  h.tipT = title; h.tipB = body; h.click = () -> {};
              }

              // ------------------------------------------------------------------ render
              @Override
              public void render(DrawContext ctx, int mx, int my, float delta) {
                  long now = System.nanoTime();
                  dt = Math.min(0.05f, (now - last) / 1e9f);
                  last = now; time += dt;
                  mouseX = mx; mouseY = my;
                  Theme.update(dt);
                  hits.clear();
                  clipAll();
                  int acc = Theme.accent();
                  MeowModule fx = fx();

                  ctx.fillGradient(0, 0, width, height, Glass.argb(205, 6, 7, 18), Glass.mix(Glass.argb(215, 12, 8, 28), Glass.a(acc, 150), 0.30f));
                  if (fx.bool("Falling Snow")) {
                      if ((int) fx.num("Snow Density") != snowCount) { snowCount = (int) fx.num("Snow Density"); snow.init(width, height, snowCount); }
                      snow.render(ctx, dt, time);
                  }

                  pw = Math.min(width - 10, 440); ph = Math.min(height - 10, 272);
                  px = (width - pw) / 2; py = (height - ph) / 2;
                  sw = pw < 320 ? 70 : 84;
                  Glass.panel(ctx, px, py, pw, ph, 10, acc, 1f);

                  // header
                  Text title = Text.literal("MEOW CLIENT").formatted(Formatting.BOLD);
                  ctx.drawText(textRenderer, title, px + 15, py + 10, Glass.a(acc, 110), false);
                  ctx.drawText(textRenderer, title, px + 14, py + 9, 0xFFFFFFFF, true);
                  int active = 0;
                  for (MeowModule m : ModuleManager.ALL) if (m.enabled && m.kind != Kind.SYSTEM) active++;
                  String st = active + " active";
                  txt(ctx, st, px + pw - 14 - textRenderer.getWidth(st), py + 10, DIM);
                  ctx.fill(px + 10, py + 24, px + pw - 10, py + 25, Glass.a(acc, 80));

                  renderSidebar(ctx, acc);
                  ctx.fill(px + sw, py + 30, px + sw + 1, py + ph - 10, Glass.a(acc, 50));

                  int cx = px + sw + 8, cy = py + 30, cw = pw - sw - 16, ch = ph - 38;
                  scroll += (scrollTarget - scroll) * Math.min(1f, dt * 14f);
                  clipX = cx; clipY = cy; clipW = cw; clipH = ch;
                  ctx.enableScissor(cx, cy, cx + cw, cy + ch);
                  if (sel == null) renderList(ctx, cx, cy, cw, ch, acc); else renderConfig(ctx, cx, cy, cw, ch, acc);
                  ctx.disableScissor();
                  clipAll();

                  // tooltip (animated fade)
                  Hit hov = null;
                  for (Hit h : hits) if (h.tipT != null && h.contains(mx, my)) hov = h;
                  if (hov != null) { tipT = hov.tipT; tipB = hov.tipB; }
                  tipA += ((hov != null ? 1f : 0f) - tipA) * Math.min(1f, dt * 12f);
                  if (tipA > 0.06f) drawTooltip(ctx, mx, my, acc);

                  if (fx.bool("Cursor Orbit")) orbit.render(ctx, mx, my, dt, time, acc);
              }

              private void renderSidebar(DrawContext ctx, int acc) {
                  int x = px + 8, y = py + 32, w = sw - 10;
                  for (int i = 0; i < ModuleManager.CATEGORIES.length; i++) {
                      float a = anim("cat" + i, i == catIdx, 12f);
                      boolean hover = mouseX >= x && mouseX < x + w && mouseY >= y && mouseY < y + 20;
                      float hv = anim("cath" + i, hover, 14f);
                      Glass.rrect(ctx, x, y, w, 20, 7, Glass.mix(Glass.argb(10 + (int) (hv * 30), 255, 255, 255), Glass.a(acc, 120), a));
                      if (a > 0.05f) Glass.outline(ctx, x, y, w, 20, 7, Glass.a(acc, (int) (200 * a)));
                      String name = ModuleManager.CATEGORIES[i];
                      txt(ctx, name, x + (w - textRenderer.getWidth(name)) / 2, y + 6, TXT);
                      final int idx = i;
                      Hit h = add(x, y, w, 20);
                      h.click = () -> { catIdx = idx; sel = null; scroll = 0; scrollTarget = 0; };
                      y += 23;
                  }
                  // theme changer, bottom-left
                  int ty = py + ph - 30;
                  txt(ctx, "Theme", px + 10, ty - 11, DIM);
                  for (int i = 0; i < Theme.COLORS.length; i++) {
                      int x0 = px + 10 + i * 15;
                      float s = anim("theme" + i, Theme.index == i, 12f);
                      if (s > 0.05f) Glass.outline(ctx, x0 - 2, ty - 2, 15, 15, 7, Glass.a(0xFFFFFF, (int) (220 * s)));
                      Glass.rrect(ctx, x0, ty, 11, 11, 5, 0xFF000000 | Theme.COLORS[i]);
                      ctx.fill(x0 + 3, ty + 2, x0 + 6, ty + 3, Glass.argb(120, 255, 255, 255));
                      final int idx = i;
                      Hit h = add(x0 - 2, ty - 2, 15, 15);
                      h.click = () -> Theme.set(idx);
                      h.tipT = Theme.NAMES[i] + " theme";
                      h.tipB = "Switch the whole interface to the " + Theme.NAMES[i].toLowerCase() + " accent color. Colors blend smoothly.";
                  }
              }

              // ------------------------------------------------------------------ module list
              private void renderList(DrawContext ctx, int cx, int cy, int cw, int ch, int acc) {
                  int y = cy - (int) scroll, start = y;
                  String cat = ModuleManager.CATEGORIES[catIdx];
                  if (cat.equals("Combat")) {
                      for (String sec : ModuleManager.COMBAT_SECTIONS) {
                          boolean o = open.contains(sec);
                          List<MeowModule> list = ModuleManager.in(cat, sec);
                          y = sectionHeader(ctx, cx, y, cw, sec, o, list.size(), cy, ch, acc);
                          if (o) for (MeowModule m : list) y = moduleRow(ctx, m, cx + 8, y, cw - 8, cy, ch, acc);
                          y += 2;
                      }
                  } else {
                      for (MeowModule m : ModuleManager.in(cat, null)) y = moduleRow(ctx, m, cx, y, cw, cy, ch, acc);
                  }
                  maxScroll = Math.max(0, (y - start) - ch + 2);
                  scrollTarget = Math.max(0, Math.min(maxScroll, scrollTarget));
              }

              private boolean visible(int y, int h, int cy, int ch) { return y + h >= cy && y <= cy + ch; }

              private int sectionHeader(DrawContext ctx, int x, int y, int w, String name, boolean o, int count, int cy, int ch, int acc) {
                  int h = 20;
                  if (visible(y, h, cy, ch)) {
                      boolean hover = mouseX >= x && mouseX < x + w && mouseY >= y && mouseY < y + h && mouseY >= cy && mouseY < cy + ch;
                      float hv = anim("sec" + name, hover, 14f);
                      Glass.card(ctx, x, y, w, h, 7, acc, hv);
                      float oa = anim("secopen" + name, o, 10f);
                      ctx.fill(x + 8, y + 9, x + 14, y + 11, Glass.a(acc, 255));
                      if (oa < 0.5f) ctx.fill(x + 10, y + 7, x + 12, y + 13, Glass.a(acc, 255));
                      ctx.drawText(textRenderer, Text.literal(name).formatted(Formatting.BOLD), x + 20, y + 6, TXT, false);
                      String c = count + " modules";
                      txt(ctx, c, x + w - 8 - textRenderer.getWidth(c), y + 6, DIM);
                      Hit hit = add(x, y, w, h);
                      hit.click = () -> { if (open.contains(name)) open.remove(name); else open.add(name); };
                  }
                  return y + h + 3;
              }

              private int moduleRow(DrawContext ctx, MeowModule m, int x, int y, int w, int cy, int ch, int acc) {
                  int h = 22;
                  if (visible(y, h, cy, ch)) {
                      boolean hover = mouseX >= x && mouseX < x + w && mouseY >= y && mouseY < y + h && mouseY >= cy && mouseY < cy + ch;
                      float hv = anim("row" + m.id(), hover, 14f);
                      Glass.card(ctx, x, y, w, h, 7, acc, hv);
                      Hit row = add(x, y, w, h);
                      row.click = () -> { sel = m; scroll = 0; scrollTarget = 0; };
                      boolean ih = mouseX >= x + 4 && mouseX < x + 18 && mouseY >= y + 3 && mouseY < y + 19;
                      infoIcon(ctx, x + 6, y + 5, acc, m.name, m.purpose + "  Recommended: " + m.recommended, ih);
                      txt(ctx, m.name, x + 24, y + 7, TXT);
                      if (w > 230 && m.kind != Kind.SYSTEM) {
                          String tag = m.kind == Kind.HUD ? "HUD" : "TEST";
                          txt(ctx, tag, x + w - 62 - textRenderer.getWidth(tag), y + 7, m.kind == Kind.HUD ? Glass.a(acc, 255) : 0xFFE0B040);
                      }
                      txt(ctx, ">", x + w - 52, y + 7, DIM);
                      if (m.kind != Kind.SYSTEM) {
                          toggle(ctx, x + w - 30, y + 5, m.enabled, "tg" + m.id(), acc);
                          Hit t = add(x + w - 34, y + 2, 30, 18);
                          t.click = () -> m.enabled = !m.enabled;
                          t.tipT = (m.enabled ? "Disable " : "Enable ") + m.name;
                          t.tipB = "Turns this module's " + (m.kind == Kind.HUD ? "information display" : "saved placeholder state") + " on or off.";
                      }
                  }
                  return y + h + 3;
              }

              // ------------------------------------------------------------------ config panel
              private int section(DrawContext ctx, String head, String body, int x, int y, int w, int acc) {
                  ctx.drawText(textRenderer, Text.literal(head).formatted(Formatting.BOLD), x + 2, y, Glass.a(acc, 255), false);
                  return wrapped(ctx, body, x + 2, y + 11, w - 4, DIM) + 6;
              }

              private void renderConfig(DrawContext ctx, int cx, int cy, int cw, int ch, int acc) {
                  MeowModule m = sel;
                  int y = cy - (int) scroll, start = y;
                  boolean bh = mouseX >= cx && mouseX < cx + 50 && mouseY >= y && mouseY < y + 16;
                  Glass.card(ctx, cx, y, 50, 16, 6, acc, anim("back", bh, 14f));
                  txt(ctx, "< Back", cx + 8, y + 4, TXT);
                  add(cx, y, 50, 16).click = () -> { sel = null; scroll = 0; scrollTarget = 0; };
                  ctx.drawText(textRenderer, Text.literal(m.name).formatted(Formatting.BOLD), cx + 58, y + 4, TXT, true);
                  if (m.kind != Kind.SYSTEM) {
                      toggle(ctx, cx + cw - 26, y + 2, m.enabled, "cfgtg" + m.id(), acc);
                      Hit t = add(cx + cw - 30, y, 30, 16);
                      t.click = () -> m.enabled = !m.enabled;
                      t.tipT = "Enable / disable";
                      t.tipB = "Master switch for " + m.name + ".";
                  }
                  y += 22;
                  String tag = m.kind == Kind.HUD ? "LIVE INFORMATION HUD" : m.kind == Kind.PLACEHOLDER ? "TESTING PLACEHOLDER - NO AUTOMATION" : "CLIENT SETTING";
                  txt(ctx, tag, cx + 2, y, m.kind == Kind.PLACEHOLDER ? 0xFFE0B040 : Glass.a(acc, 255));
                  y += 14;
                  y = section(ctx, "Purpose", m.purpose, cx, y, cw, acc);
                  y = section(ctx, "How it works", m.how, cx, y, cw, acc);
                  y = section(ctx, "Recommended settings", m.recommended, cx, y, cw, acc);
                  if (!m.settings.isEmpty()) {
                      ctx.drawText(textRenderer, Text.literal("Settings").formatted(Formatting.BOLD), cx + 2, y, Glass.a(acc, 255), false);
                      y += 13;
                      for (Setting s : m.settings) y = settingCard(ctx, s, cx, y, cw, cy, ch, acc);
                  }
                  maxScroll = Math.max(0, (y - start) - ch + 2);
                  scrollTarget = Math.max(0, Math.min(maxScroll, scrollTarget));
              }

              private int settingCard(DrawContext ctx, Setting s, int x, int y, int w, int cy, int ch, int acc) {
                  int descH = wrapCount(s.desc, w - 16) * 10;
                  boolean num = s instanceof Setting.Num;
                  int h = (num ? 32 : 22) + descH + 4;
                  if (visible(y, h, cy, ch)) {
                      Glass.card(ctx, x, y, w, h, 7, acc, 0f);
                      boolean ih = mouseX >= x + 4 && mouseX < x + 18 && mouseY >= y + 3 && mouseY < y + 19;
                      infoIcon(ctx, x + 6, y + 5, acc, s.name, s.desc, ih);
                      txt(ctx, s.name, x + 24, y + 7, TXT);
                      int by;
                      if (s instanceof Setting.Bool b) {
                          toggle(ctx, x + w - 30, y + 5, b.value, "st" + s.name + y, acc);
                          add(x + w - 34, y + 2, 30, 18).click = () -> b.value = !b.value;
                          by = y + 22;
                      } else {
                          Setting.Num n = (Setting.Num) s;
                          String v = n.display();
                          txt(ctx, v, x + w - 8 - textRenderer.getWidth(v), y + 7, Glass.a(acc, 255));
                          int sx = x + 8, sy = y + 21, sw2 = w - 16;
                          Glass.rrect(ctx, sx, sy, sw2, 5, 2, Glass.argb(60, 255, 255, 255));
                          int fw = Math.max(4, (int) (sw2 * n.fraction()));
                          Glass.rrect(ctx, sx, sy, fw, 5, 2, Glass.a(acc, 220));
                          Glass.rrect(ctx, sx + fw - 4, sy - 2, 8, 9, 4, 0xFFFFFFFF);
                          Hit hit = add(sx - 4, sy - 5, sw2 + 8, 14);
                          hit.drag = f -> n.setFraction(f);
                          by = y + 32;
                      }
                      wrapped(ctx, s.desc, x + 8, by, w - 16, DIM);
                  }
                  return y + h + 3;
              }

              // ------------------------------------------------------------------ tooltip
              private void drawTooltip(DrawContext ctx, int mx, int my, int acc) {
                  int w = Math.min(190, width - 16);
                  List<OrderedText> lines = textRenderer.wrapLines(Text.literal(tipB.isEmpty() ? "No description." : tipB), w - 14);
                  int h = 12 + 13 + lines.size() * 10 + 4;
                  int x = Math.max(6, Math.min(width - w - 6, mx + 10));
                  int y = my + 14;
                  if (y + h > height - 6) y = my - h - 8;
                  y = Math.max(6, y);
                  float a = Math.min(1f, tipA);
                  Glass.panel(ctx, x, y, w, h, 7, acc, a);
                  int al = Math.max(14, (int) (255 * a));
                  ctx.drawText(textRenderer, Text.literal(tipT).formatted(Formatting.BOLD), x + 7, y + 6, Glass.a(acc, al), false);
                  int ty = y + 19;
                  for (OrderedText l : lines) { ctx.drawText(textRenderer, l, x + 7, ty, Glass.a(0xE6EAF8, al), false); ty += 10; }
              }

              // ------------------------------------------------------------------ input (1.21.9+ Click / KeyInput API)
              @Override
              public boolean mouseClicked(Click click, boolean doubled) {
                  if (click.button() == 0) {
                      for (int i = hits.size() - 1; i >= 0; i--) {
                          Hit h = hits.get(i);
                          if ((h.click != null || h.drag != null) && h.contains(click.x(), click.y())) {
                              if (h.drag != null) { dragHit = h; h.drag.accept((click.x() - h.x - 4) / (h.w - 8)); }
                              else h.click.run();
                              return true;
                          }
                      }
                  }
                  return super.mouseClicked(click, doubled);
              }

              @Override
              public boolean mouseDragged(Click click, double dx, double dy) {
                  if (dragHit != null) { dragHit.drag.accept((click.x() - dragHit.x - 4) / (dragHit.w - 8)); return true; }
                  return super.mouseDragged(click, dx, dy);
              }

              @Override
              public boolean mouseReleased(Click click) {
                  dragHit = null;
                  return super.mouseReleased(click);
              }

              @Override
              public boolean mouseScrolled(double mx, double my, double horizontal, double vertical) {
                  scrollTarget = Math.max(0, Math.min(maxScroll, scrollTarget - (float) vertical * 26f));
                  return true;
              }

              @Override
              public boolean keyPressed(KeyInput input) {
                  if (input.key() == GLFW.GLFW_KEY_RIGHT_SHIFT) { close(); return true; }
                  return super.keyPressed(input);
              }
          }
