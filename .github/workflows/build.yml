                          return new Block("Combat", L, bar, barCol);
                      }
                      case "Spear Reach Information": {
                          if (!m.bool("Spear Reach Information") || !isSpear(main)) return null; // only while a spear is held
                          if (m.bool("Weapon Detection")) L.add(GR + "Weapon: " + W + main.getName().getString());
                          if (m.bool("Reach Display")) {
                              L.add(GR + "Base interaction range: " + W + fmt(p.getAttributeValue(EntityAttributes.ENTITY_INTERACTION_RANGE)));
                              L.add(GR + "Spear reach: see item tooltip");
                              if (mc.targetedEntity != null) L.add(GR + "Target distance: " + W + fmt(p.getEyePos().distanceTo(mc.targetedEntity.getEyePos())));
                          }
                          if (m.bool("Visual Indicator")) {
                              if (mc.targetedEntity != null) bar = (float) Math.min(1, p.getEyePos().distanceTo(mc.targetedEntity.getEyePos()) / 6.0);
                              else bar = 0;
                              barCol = 0xFFA855F7;
                              L.add(GR + "Reach bar (scale 0-6 blocks)");
                              String wc = weaponChange(mc);
                              if (wc != null) L.add(wc);
                          }
                          return new Block("Spear Reach", L, bar, barCol);
                      }
                      case "Stun Slam Education": {
                          boolean axe = main.isIn(ItemTags.AXES);
                          L.add(GR + "Weapon: " + W + main.getName().getString() + GR + (mace ? " [MACE]" : axe ? " [AXE]" : ""));
                          L.add(GR + "Fall: " + W + fmt(fd) + GR + "  Down vel: " + W + fmt(vy) + " b/s");
                          L.add(GR + "Smash: " + (mace && !p.isOnGround() && fd > 1.5 ? G + "possible" : GR + "no") + GR + "  Est: " + W + fmt(smashBonus(fd)));
                          if (m.bool("Show Altitude")) L.add(GR + "Altitude: " + W + groundDist + GR + (groundDist >= m.num("Warning Threshold") ? R + "  HIGH ALTITUDE" : ""));
                          if (m.bool("Visual Warning") && mace && fd >= m.num("Warning Threshold")) L.add(R + "!! Threshold reached !!");
                          String wc = weaponChange(mc);
                          if (wc != null) L.add(wc);
                          return new Block("Stun Slam", L, -1, 0);
                      }
                      case "High-Place Mace Practice": {
                          double min = m.num("Min Fall Distance");
                          L.add(GR + "Fall distance: " + W + fmt(fd));
                          if (m.bool("Show Velocity")) L.add(GR + "Vertical speed: " + W + fmt(vy) + " b/s");
                          if (m.bool("Show Altitude")) L.add(GR + "Above ground: " + W + groundDist + " blocks");
                          L.add("Smash: " + (mace && !p.isOnGround() && fd > min ? G + "ELIGIBLE" : GR + "not yet") + GR + "  Est: " + W + fmt(smashBonus(fd)));
                          if (m.bool("Show Timing Bar")) { bar = (float) Math.min(1, fd / min); barCol = fd > min ? 0xFF22C55E : 0xFFEAB308; }
                          return new Block("High-Place Practice", L, bar, barCol);
                      }
                      case "Speed Display": {
                          Vec3d v = p.getVelocity();
                          double sp = Math.hypot(v.x, v.z) * 20;
                          L.add(GR + "Speed: " + W + (m.bool("Show Decimals") ? fmt(sp) : String.valueOf(Math.round(sp))) + " b/s");
                          return new Block("Speed", L, -1, 0);
                      }
                      case "Position Info": {
                          L.add(GR + "XYZ: " + W + p.getBlockX() + ", " + p.getBlockY() + ", " + p.getBlockZ());
                          if (m.bool("Show Facing")) L.add(GR + "Facing: " + W + p.getHorizontalFacing().asString());
                          return new Block("Position", L, -1, 0);
                      }
                      case "Health And Hunger": {
                          L.add(GR + "Health: " + W + fmt(p.getHealth()));
                          L.add(GR + "Hunger: " + W + p.getHungerManager().getFoodLevel());
                          if (m.bool("Show Saturation")) L.add(GR + "Saturation: " + W + fmt(p.getHungerManager().getSaturationLevel()));
                          return new Block("Vitals", L, -1, 0);
                      }
                      case "Held Item Info": {
                          L.add(name(main));
                          if (m.bool("Show Durability") && main.isDamageable()) L.add(GR + "Durability: " + W + (main.getMaxDamage() - main.getDamage()));
                          return new Block("Held Item", L, -1, 0);
                      }
                      case "Watermark": {
                          L.add(m.bool("Show FPS") ? GR + "FPS: " + W + mc.getCurrentFps() : GR + "Liquid Glass");
