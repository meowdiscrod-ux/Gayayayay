                          return new Block("Mace Mechanics", L, bar, barCol);
                      }
                      case "Fall Distance Information": {
                          double min = m.num("Min Fall Distance");
                          L.add(GR + "Fall distance: " + (fd > min ? G : W) + fmt(fd));
                          L.add(GR + "Minimum: " + W + fmt(min));
                          if (m.bool("Show Bar")) { bar = (float) Math.min(1, fd / min); barCol = fd > min ? 0xFF22C55E : 0xFFEAB308; }
                          return new Block("Fall Distance", L, bar, barCol);
                      }
                      case "Smash Attack Information": {
                          boolean air = !p.isOnGround();
                          boolean ok = mace && air && fd > 1.5;
                          L.add(check("Mace held", mace)); L.add(check("In the air", air)); L.add(check("Fall > 1.5", fd > 1.5));
                          L.add("Smash: " + (ok ? G + "ELIGIBLE" : GR + "not eligible"));
                          if (m.bool("Show Damage Estimate")) L.add(GR + "Est. bonus: " + W + fmt(smashBonus(fd)));
                          return new Block("Smash Info", L, -1, 0);
                      }
                      case "Wind Charge Information": {
                          L.add(GR + "Wind charges: " + W + count(inv, s -> s.isOf(Items.WIND_CHARGE)));
                          if (m.bool("Show Held Hint") && main.isOf(Items.WIND_CHARGE)) L.add(Y + "Wind charge in hand");
                          return new Block("Wind Charges", L, -1, 0);
                      }
                      case "Spear Mechanics": {
                          boolean sp = isSpear(main);
