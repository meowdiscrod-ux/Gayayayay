                      case "Health HUD": {
                          L.add(GR + "Health: " + W + fmt(p.getHealth()) + GR + " / " + fmt(p.getMaxHealth()));
                          if (m.bool("Show Absorption")) L.add(GR + "Absorption: " + Y + fmt(p.getAbsorptionAmount()));
                          bar = (float) (p.getHealth() / p.getMaxHealth()); barCol = 0xFFEF4444;
