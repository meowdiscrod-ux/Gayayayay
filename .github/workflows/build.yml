                      case "Active Modules": {
                          for (MeowModule o : com.meowclient.module.ModuleManager.ALL)
                              if (o.enabled && o != m && o.kind != MeowModule.Kind.SYSTEM) L.add(W + o.name);
                          if (L.isEmpty()) L.add(GR + "None");
                          return new Block("Active", L, -1, 0);
                      }
                      default:
                          return null;
                  }
              }
          }
