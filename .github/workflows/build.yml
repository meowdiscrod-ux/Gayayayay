          package com.meowclient.module;

          import com.meowclient.module.MeowModule.Kind;

          /** Every module definition: explanations, recommended settings and configurable options. */
          final class Content {
              private static final String CMB = "Combat";

              private static MeowModule add(String cat, String sec, String name, Kind k, String purpose, String how, String rec, Setting... s) {
                  MeowModule m = new MeowModule(cat, sec, name, k, purpose, how, rec);
                  for (Setting x : s) m.settings.add(x);
                  ModuleManager.ALL.add(m);
                  return m;
              }
              private static MeowModule hud(String cat, String sec, String n, String p, String h, String r, Setting... s) { return add(cat, sec, n, Kind.HUD, p, h, r, s); }
              private static MeowModule ph(String sec, String n, String p, String h, String r, Setting... s) { return add(CMB, sec, n, Kind.PLACEHOLDER, p, h, r, s); }
              private static Setting.Bool b(String n, boolean d, String desc) { return new Setting.Bool(n, d, desc); }
              private static Setting.Num n(String n, double d, double min, double max, double step, String unit, String desc) { return new Setting.Num(n, d, min, max, step, unit, desc); }

              private static final String NOAUTO = " Meow Client never attacks, swaps items or aims for you - this entry only stores settings so you can study the concept.";
              private static final String ARMOR_P = "Shows the remaining durability of each worn armor piece on the HUD.";
              private static final String ARMOR_H = "Reads the four armor slots every frame: durability left = max damage - current damage. Colors: green above 50%, yellow above 25%, red below. Useful because armor breaks quickly under crystals, anchors and maces.";

              static void register() {
                  // ===================== GENERAL COMBAT =====================
                  String G = "General Combat";
                  hud(CMB, G, "Auto Mace",
                      "Educational model of the original Auto Mace idea. It never attacks or switches items; it only shows the live checklist the original logic tested.",
                      "1) Fall detection: player.fallDistance greater than 1.5. 2) Downward velocity: Y velocity below zero. 3) Target: crosshair on a LivingEntity. 4) Weapon: Items.MACE selected. 5) Attack: the smash only works when all four hold; bonus damage grows with fall height (about +4 per block for the first 3, +2 for the next 5, +1 after). The attack cooldown also limits timing.",
                      "Min Fall Distance 1.5, Cooldown 500 ms, Legit Mode on while learning.",
                      n("Min Fall Distance", 1.5, 1.0, 3.0, 0.1, "blocks", "Fall height the checklist requires. Vanilla smash needs more than 1.5 blocks; higher is stricter."),
                      n("Cooldown", 500, 0, 1000, 50, "ms", "How long all conditions must stay true before the indicator changes from ARMING to READY. 0 = instant."),
                      b("Legit Mode", true, "Conservative testing option: adds 0.5 blocks to the fall requirement and also needs the weapon cooldown at 90% or more."));
                  ph(G, "Trigger Bot",
                      "Concept: attack automatically when the crosshair is on a valid entity." + NOAUTO,
                      "Original: each tick it checks that the crosshair entity is a LivingEntity, waits for a 300 ms cooldown since the last swing, then attacks. The cooldown stops it from swinging faster than a weapon can recharge.",
                      "Cooldown 300 ms (original value).",
                      n("Cooldown", 300, 0, 1000, 50, "ms", "Minimum time between simulated swings in the original design."),
                      b("Living Entities Only", true, "Original only reacted to LivingEntity targets, ignoring items, arrows and boats."));
                  ph(G, "Aim Assist",
                      "Concept: gently rotate the camera toward the nearest entity." + NOAUTO,
                      "Original: find the nearest entity within 4 blocks, compute the yaw and pitch to its eye height, then rotate only a fraction of that angle per tick (smooth rotation) so the view never snaps.",
                      "Range 4.0 blocks, Smoothness 8.",
                      n("Range", 4.0, 1.0, 6.0, 0.5, "blocks", "Maximum distance for nearest-entity targeting. Original: 4 blocks."),
                      n("Smoothness", 8, 1, 20, 1, "", "Higher = slower, gentler rotation toward the target."));
                  ph(G, "Auto Anchor",
                      "Concept: automate the respawn anchor sequence of place, charge, detonate." + NOAUTO,
                      "Respawn anchors hold 1-4 charges from glowstone. Outside the Nether, using a charged anchor makes it explode. The original macro chained place, charge, item switch and detonate. See Crystal PvP > Anchor Information for a live view instead.",
                      "Keep off; use Anchor Information for study.",
                      n("Charges", 1, 1, 4, 1, "", "Glowstone charges the original added before detonating."),
                      b("Safe Mode", true, "Original option to avoid detonating while too close to the user."));
