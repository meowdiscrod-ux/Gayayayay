          package com.meowclient.gui;

          import net.minecraft.client.gui.DrawContext;

          import java.util.Random;

          /** Lightweight falling snow: struct-of-arrays, one fill per flake, wraps around smoothly. */
          public final class SnowEffect {
              private float[] x, y, speed, drift, phase;
              private int[] size, alpha;
              private int w, h, n;

              public void init(int w, int h, int count) {
                  this.w = w; this.h = h; this.n = count;
                  Random rnd = new Random();
                  x = new float[n]; y = new float[n]; speed = new float[n]; drift = new float[n]; phase = new float[n];
                  size = new int[n]; alpha = new int[n];
                  for (int i = 0; i < n; i++) {
                      size[i] = 1 + rnd.nextInt(3);
                      speed[i] = 14f + size[i] * 9f + rnd.nextFloat() * 14f;
                      drift[i] = 4f + rnd.nextFloat() * 10f;
                      phase[i] = rnd.nextFloat() * 6.2832f;
                      alpha[i] = 55 + rnd.nextInt(90);
                      x[i] = rnd.nextFloat() * w;
                      y[i] = rnd.nextFloat() * h;
                  }
              }

              public void render(DrawContext c, float dt, float t) {
                  for (int i = 0; i < n; i++) {
                      y[i] += speed[i] * dt;
                      x[i] += (float) Math.sin(t * 0.9f + phase[i]) * drift[i] * dt;
                      if (y[i] > h) { y[i] = -size[i]; x[i] = (float) (Math.random() * w); }
                      if (x[i] < -4) x[i] = w + 2; else if (x[i] > w + 4) x[i] = -2;
                      int px = (int) x[i], py = (int) y[i], s = size[i];
                      c.fill(px, py, px + s, py + s, Glass.argb(alpha[i], 255, 255, 255));
                      if (s == 3) c.fill(px - 1, py + 1, px + 4, py + 2, Glass.argb(alpha[i] / 4, 255, 255, 255));
                  }
              }
          }
